<!DOCTYPE html>
<html lang="en" style="height:100%;padding:0;margin:0">
<head>
    <title>gpxt</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/static/favicon.png" type="image/png"/>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #111827;
            color: #f9fafb;
            font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1 {
            color: #f97316;
            font-size: 20px;
            letter-spacing: 0.03em;
            margin: 0 0 24px;
            text-align: center;
        }
        .tools {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        a.tool {
            display: block;
            padding: 14px 28px;
            background: #0d1117;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #f9fafb;
            text-decoration: none;
            font-weight: 600;
            text-align: center;
        }
        a.tool:hover {
            border-color: #f97316;
        }
    </style>
</head>
<body>
<div>
    <h1>gpxt</h1>
    <div class="tools">
        <a class="tool" href="/poster">GPX Poster</a>
        <a class="tool" href="/show">Show tracks</a>
    </div>
</div>
</body>
</html>
