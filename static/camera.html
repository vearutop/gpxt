<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Landscape Camera Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
  #canvas-wrap{position:fixed;inset:0}
  canvas{display:block;cursor:grab}
  canvas.dragging{cursor:grabbing}
  #panel{position:fixed;top:10px;left:10px;background:rgba(20,20,20,0.78);color:#eee;padding:10px 14px;
    border-radius:8px;font-size:13px;max-width:250px;backdrop-filter:blur(4px)}
  #panel label{display:block;margin-top:6px}
  #panel input[type=number]{width:110px}
  #panel input[type=range]{width:140px;vertical-align:middle}
  #panel select{width:100%}
  #fov-readout{font-weight:bold;color:#8f8}
  #status{position:fixed;bottom:10px;left:10px;color:#ccc;font:12px monospace;background:rgba(0,0,0,0.5);
    padding:4px 8px;border-radius:4px;max-width:70vw}
  button{margin-top:8px;cursor:pointer}
  hr{border:none;border-top:1px solid #555;margin:8px 0}
  .hint{font-size:11px;color:#999;margin-top:6px}
  #frame-guide{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    box-shadow:0 0 0 9999px rgba(0,0,0,0.45);pointer-events:none}
  #frame-guide .corner{position:absolute;width:28px;height:28px;border:2px solid #fff;opacity:0.85}
  #frame-guide .tl{top:-2px;left:-2px;border-right:none;border-bottom:none}
  #frame-guide .tr{top:-2px;right:-2px;border-left:none;border-bottom:none}
  #frame-guide .bl{bottom:-2px;left:-2px;border-right:none;border-top:none}
  #frame-guide .br{bottom:-2px;right:-2px;border-left:none;border-top:none}
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="frame-guide">
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
</div>

<div id="panel">
  <div><strong>Landscape Camera Preview</strong></div>
  <label>Lat, Lon <input id="latlon" type="text" value="42.1985732535241, 23.31115740159605"
    placeholder="paste from Google Maps"></label>
  <button id="load-btn">Load terrain</button>
  <hr>
  <label>Focal length (mm) <input id="focal" type="number" min="8" max="800" value="50"></label>
  <label>Sensor
    <select id="sensor-preset">
      <option value="36,24" selected>Full frame (36×24mm)</option>
      <option value="23.5,15.6">APS-C (23.5×15.6mm)</option>
      <option value="22.3,14.9">APS-C Canon (22.3×14.9mm)</option>
      <option value="17.3,13">Micro Four Thirds (17.3×13mm)</option>
      <option value="13.2,8.8">1" type (13.2×8.8mm)</option>
      <option value="custom">Custom…</option>
    </select>
  </label>
  <label id="custom-sensor-row" style="display:none">Custom W×H (mm)
    <input id="sensor-w" type="number" value="36" style="width:50px"> ×
    <input id="sensor-h" type="number" value="24" style="width:50px">
  </label>
  <label>Sun azimuth <input id="sun-az" type="range" min="0" max="360" value="130"></label>
  <label>Sun altitude <input id="sun-alt" type="range" min="0" max="90" value="35"></label>
  <div>FOV: <span id="fov-readout">-</span></div>
  <div class="hint">Drag to pan/tilt. WASD to walk, Space/C to rise/sink.</div>
  <div class="hint">Imagery © Esri, Maxar, Earthstar Geographics. Elevation: Mapzen Terrarium tiles.</div>
</div>

<div id="status">Loading…</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js"}}

<script type="module">
import * as THREE from 'three';

const TILE_SIZE = 256;
const GRID_RADIUS = 2;   // fetches a (2*GRID_RADIUS+1)^2 tile grid around the point
const MESH_STRIDE = 3;   // downsamples the DEM grid to keep triangle count sane

// The horizon ring: a second, much coarser and wider terrain patch so distant peaks show
// as a silhouette instead of the near terrain just ending in flat sky.
const FAR_ZOOM = 10;
const FAR_GRID_RADIUS = 3;
const FAR_MESH_STRIDE = 6;

// ---- pure geo/math helpers -------------------------------------------------

function lonLatToTileFrac(lon, lat, zoom) {
  const n = 2 ** zoom;
  const x = (lon + 180) / 360 * n;
  const latRad = lat * Math.PI / 180;
  const y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
  return [x, y];
}

function pixelToLonLat(globalPx, globalPy, zoom) {
  const n = 2 ** zoom * TILE_SIZE;
  const lon = globalPx / n * 360 - 180;
  const latRad = Math.atan(Math.sinh(Math.PI * (1 - 2 * globalPy / n)));
  return [lon, latRad * 180 / Math.PI];
}

function decodeTerrarium(r, g, b) {
  return (r * 256 + g + b / 256) - 32768;
}

function metersPerDegree(lat0) {
  return { latM: 111320, lonM: 111320 * Math.cos(lat0 * Math.PI / 180) };
}

// ---- self-check: catches a broken tile-math edit before it ruins a render ----
(function selfCheck() {
  console.assert(decodeTerrarium(128, 0, 0) === 0, 'terrarium decode baseline wrong');
  console.assert(Math.abs(decodeTerrarium(128, 128, 128) - 128.5) < 1e-9, 'terrarium decode fraction wrong');

  const zoom = 13, lon0 = 23.31115740159605, lat0 = 42.1985732535241;
  const [xf, yf] = lonLatToTileFrac(lon0, lat0, zoom);
  const [lon2, lat2] = pixelToLonLat(xf * TILE_SIZE, yf * TILE_SIZE, zoom);
  console.assert(Math.abs(lon2 - lon0) < 1e-6 && Math.abs(lat2 - lat0) < 1e-6,
    'lonLatToTileFrac/pixelToLonLat round-trip broken', lon2, lat2);
})();

// ---- DEM loading ------------------------------------------------------------

async function fetchTileBitmap(url) {
  const resp = await fetch(url, { mode: 'cors' });
  if (!resp.ok) throw new Error(`tile fetch failed (HTTP ${resp.status}): ${url}`);

  return createImageBitmap(await resp.blob());
}

async function loadDemTile(x, y, zoom) {
  const n = 2 ** zoom;
  const wrappedX = ((x % n) + n) % n;
  const bitmap = await fetchTileBitmap(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${zoom}/${wrappedX}/${y}.png`);

  const canvas = document.createElement('canvas');
  canvas.width = TILE_SIZE;
  canvas.height = TILE_SIZE;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0);

  return ctx.getImageData(0, 0, TILE_SIZE, TILE_SIZE).data;
}

async function loadTerrain(lat, lon, zoom, gridRadius) {
  const [cxFrac, cyFrac] = lonLatToTileFrac(lon, lat, zoom);
  const cx = Math.floor(cxFrac), cy = Math.floor(cyFrac);
  const n = 2 * gridRadius + 1;
  const cols = n * TILE_SIZE;
  const grid = new Float32Array(cols * cols);

  const tasks = [];
  for (let ty = -gridRadius; ty <= gridRadius; ty++) {
    for (let tx = -gridRadius; tx <= gridRadius; tx++) {
      const ox = (tx + gridRadius) * TILE_SIZE;
      const oy = (ty + gridRadius) * TILE_SIZE;

      tasks.push(loadDemTile(cx + tx, cy + ty, zoom).then((px) => {
        for (let py = 0; py < TILE_SIZE; py++) {
          for (let pxl = 0; pxl < TILE_SIZE; pxl++) {
            const i = (py * TILE_SIZE + pxl) * 4;
            grid[(oy + py) * cols + (ox + pxl)] = decodeTerrarium(px[i], px[i + 1], px[i + 2]);
          }
        }
      }));
    }
  }

  await Promise.all(tasks);

  return { grid, cols, originTileX: cx - gridRadius, originTileY: cy - gridRadius, zoom };
}

// ---- satellite imagery (drapes real ground texture so lakes, snow, forest read correctly) --

async function loadSatelliteImagery(lat, lon, zoom, gridRadius) {
  const [cxFrac, cyFrac] = lonLatToTileFrac(lon, lat, zoom);
  const cx = Math.floor(cxFrac), cy = Math.floor(cyFrac);
  const n = 2 * gridRadius + 1;
  const cols = n * TILE_SIZE;

  const canvas = document.createElement('canvas');
  canvas.width = cols;
  canvas.height = cols;
  const ctx = canvas.getContext('2d');

  const tasks = [];
  for (let ty = -gridRadius; ty <= gridRadius; ty++) {
    for (let tx = -gridRadius; tx <= gridRadius; tx++) {
      const ox = (tx + gridRadius) * TILE_SIZE;
      const oy = (ty + gridRadius) * TILE_SIZE;
      // Esri's REST tile path is z/row/col (y before x), unlike the usual XYZ z/x/y order.
      const url = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${cy + ty}/${cx + tx}`;
      tasks.push(fetchTileBitmap(url).then((bmp) => ctx.drawImage(bmp, ox, oy)));
    }
  }

  await Promise.all(tasks);

  return canvas;
}

// ---- terrain mesh -----------------------------------------------------------

const COLOR_STOPS = [
  [0, [0.05, 0.25, 0.08]],
  [800, [0.15, 0.35, 0.12]],
  [1600, [0.35, 0.32, 0.18]],
  [2200, [0.55, 0.50, 0.42]],
  [2700, [0.85, 0.85, 0.85]],
];

function hypsometricColor(elev) {
  for (let i = 1; i < COLOR_STOPS.length; i++) {
    const [e0, c0] = COLOR_STOPS[i - 1];
    const [e1, c1] = COLOR_STOPS[i];
    if (elev <= e1 || i === COLOR_STOPS.length - 1) {
      const t = Math.max(0, Math.min(1, (elev - e0) / (e1 - e0)));
      return [c0[0] + (c1[0] - c0[0]) * t, c0[1] + (c1[1] - c0[1]) * t, c0[2] + (c1[2] - c0[2]) * t];
    }
  }
}

function buildTerrainMesh(dem, lat0, lon0, meshStride, computeCenter, excludeHalfSize) {
  const { grid, cols, originTileX, originTileY, zoom } = dem;
  const gw = Math.floor((cols - 1) / meshStride) + 1;
  const { latM, lonM } = metersPerDegree(lat0);

  const positions = new Float32Array(gw * gw * 3);
  const colors = new Float32Array(gw * gw * 3);
  const uvs = new Float32Array(gw * gw * 2);

  for (let gy = 0; gy < gw; gy++) {
    for (let gx = 0; gx < gw; gx++) {
      const px = gx * meshStride, py = gy * meshStride;
      const [lon, lat] = pixelToLonLat(originTileX * TILE_SIZE + px, originTileY * TILE_SIZE + py, zoom);
      const elev = grid[py * cols + px];

      const idx = (gy * gw + gx) * 3;
      positions[idx] = (lon - lon0) * lonM;
      positions[idx + 1] = elev;
      positions[idx + 2] = -(lat - lat0) * latM; // north = -Z in three.js convention

      const [r, g, b] = hypsometricColor(elev);
      colors[idx] = r; colors[idx + 1] = g; colors[idx + 2] = b;

      const uvIdx = (gy * gw + gx) * 2;
      uvs[uvIdx] = px / (cols - 1);
      uvs[uvIdx + 1] = 1 - py / (cols - 1); // flip: image row 0 (north) is the top of the texture
    }
  }

  let centerElevation = 0;

  if (computeCenter) {
    // The camera must stand at the *actual* input point, not the geometric middle of the
    // fetched tile grid (that middle is the center tile's corner, not the requested pixel —
    // using it as a stand-in put the camera up to half a tile away from where it was asked
    // to be, occasionally embedding it in a nearby ridge instead of standing on the one asked for).
    const [cxFrac, cyFrac] = lonLatToTileFrac(lon0, lat0, zoom);
    const localPx = Math.round(cxFrac * TILE_SIZE - originTileX * TILE_SIZE);
    const localPy = Math.round(cyFrac * TILE_SIZE - originTileY * TILE_SIZE);

    // Take the max raw-resolution elevation in a small neighborhood around that point (not
    // just the single nearest sample) so the camera clears any bump the mesh's downsampling
    // smoothed over close by. ponytail: fixed-radius max, not a true "highest point within
    // eye height" search — widen SAFETY_RADIUS_PX if a rugged summit still clips the camera.
    const SAFETY_RADIUS_PX = meshStride * 2;
    centerElevation = -Infinity;
    for (let dy = -SAFETY_RADIUS_PX; dy <= SAFETY_RADIUS_PX; dy++) {
      for (let dx = -SAFETY_RADIUS_PX; dx <= SAFETY_RADIUS_PX; dx++) {
        const px = Math.min(cols - 1, Math.max(0, localPx + dx));
        const py = Math.min(cols - 1, Math.max(0, localPy + dy));
        centerElevation = Math.max(centerElevation, grid[py * cols + px]);
      }
    }
  }

  // Skip quads that fall entirely under the (higher-resolution) near terrain, so this
  // mesh — used for the coarse horizon ring — doesn't z-fight with it where they overlap.
  const indices = [];
  for (let gy = 0; gy < gw - 1; gy++) {
    for (let gx = 0; gx < gw - 1; gx++) {
      const a = gy * gw + gx, b = a + 1, c = a + gw, d = c + 1;

      if (excludeHalfSize) {
        const x = positions[a * 3], z = positions[a * 3 + 2];
        if (Math.abs(x) < excludeHalfSize && Math.abs(z) < excludeHalfSize) continue;
      }

      indices.push(a, c, b, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  return { geometry, centerElevation };
}

// ---- camera FOV from real lens parameters -----------------------------------

function verticalFovDeg(focalMM, sensorHeightMM) {
  return 2 * Math.atan(sensorHeightMM / (2 * focalMM)) * 180 / Math.PI;
}

const DEM_ZOOM = 14;        // fixed: not a knob a photographer needs, just tile detail
const DEFAULT_EYE_HEIGHT = 1.7;
// The rendered view is deliberately wider than the real lens frame, so the frame-guide
// overlay can show what falls just outside the shot. FRAME_MARGIN is how much of the
// (narrower) viewport dimension the true frame occupies.
const FRAME_MARGIN = 0.85;

// ---- scene setup --------------------------------------------------------

const SKY_HORIZON_COLOR = 0xcfe8f7;
const SKY_ZENITH_COLOR = 0x1e5fa8;
const FAR_CLIP = 160000; // must clear the horizon ring's ~100km radius

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(SKY_HORIZON_COLOR, 3000, 130000);

// Gradient sky dome instead of a flat background color, so there's an actual horizon
// line to compose against rather than terrain just ending in a solid-color void.
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(FAR_CLIP * 0.9, 24, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    fog: false,
    uniforms: {
      topColor: { value: new THREE.Color(SKY_ZENITH_COLOR) },
      bottomColor: { value: new THREE.Color(SKY_HORIZON_COLOR) },
    },
    vertexShader: `
      varying vec3 vWorldPosition;
      void main() {
        vWorldPosition = (modelMatrix * vec4(position, 1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vWorldPosition;
      uniform vec3 topColor;
      uniform vec3 bottomColor;
      void main() {
        float h = clamp(normalize(vWorldPosition).y, 0.0, 1.0);
        gl_FragColor = vec4(mix(bottomColor, topColor, pow(h, 0.5)), 1.0);
      }`,
  }),
);
scene.add(sky);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('canvas-wrap').appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, FAR_CLIP);
camera.rotation.order = 'YXZ';

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.1);
scene.add(sun, sun.target);

let terrainMesh = null;
let farTerrainMesh = null;
let centerElevation = 0;
let originLat = 0, originLon = 0; // lat/lon the loaded terrain (and camera x/z) is centered on

// ---- UI wiring ----------------------------------------------------------

const el = (id) => document.getElementById(id);
const [latlonEl, loadBtn, focalEl, sensorPresetEl, customRowEl, sensorWEl, sensorHEl,
  sunAzEl, sunAltEl, fovReadoutEl, statusEl, frameGuideEl] = [
  'latlon', 'load-btn', 'focal', 'sensor-preset', 'custom-sensor-row', 'sensor-w', 'sensor-h',
  'sun-az', 'sun-alt', 'fov-readout', 'status', 'frame-guide',
].map(el);

function getSensorSizeMM() {
  if (sensorPresetEl.value === 'custom') return [parseFloat(sensorWEl.value), parseFloat(sensorHEl.value)];
  return sensorPresetEl.value.split(',').map(Number);
}

// Sets up the camera to render wider than the real lens (see FRAME_MARGIN), then sizes the
// on-screen frame-guide box to exactly where the real lens's frame falls within that wider
// render — a viewfinder crop guide rather than a literal render crop.
function updateFraming() {
  const focal = parseFloat(focalEl.value);
  const [sw, sh] = getSensorSizeMM();
  const sensorAspect = sw / sh;
  const vfovTrue = verticalFovDeg(focal, sh);
  const hfovTrue = 2 * Math.atan(Math.tan(vfovTrue * Math.PI / 360) * sensorAspect) * 180 / Math.PI;
  fovReadoutEl.textContent = `${hfovTrue.toFixed(1)}° × ${vfovTrue.toFixed(1)}° (H×V)`;

  const viewW = window.innerWidth, viewH = window.innerHeight;
  const maxW = viewW * FRAME_MARGIN, maxH = viewH * FRAME_MARGIN;
  let frameH = Math.min(maxH, maxW / sensorAspect);
  let frameW = frameH * sensorAspect;

  frameGuideEl.style.width = `${frameW}px`;
  frameGuideEl.style.height = `${frameH}px`;

  const fracV = frameH / viewH;
  const vfovWide = 2 * Math.atan(Math.tan(vfovTrue * Math.PI / 360) / fracV) * 180 / Math.PI;

  camera.fov = vfovWide;
  camera.aspect = viewW / viewH;
  camera.updateProjectionMatrix();
}

function updateSun() {
  const az = parseFloat(sunAzEl.value) * Math.PI / 180;
  const alt = parseFloat(sunAltEl.value) * Math.PI / 180;
  const dist = 10000;
  sun.position.set(Math.sin(az) * Math.cos(alt) * dist, Math.sin(alt) * dist, -Math.cos(az) * Math.cos(alt) * dist);
}

// ---- shareable URL: the whole viewport (position, look direction, lens, sun) round-trips
// through the query string, so sending someone the address bar reproduces the exact shot ----

function parseUrlState() {
  const p = new URLSearchParams(window.location.search);
  const num = (key) => (p.has(key) ? parseFloat(p.get(key)) : undefined);

  return {
    lat: num('lat'), lon: num('lon'), alt: num('alt'), yaw: num('yaw'), pitch: num('pitch'),
    focal: num('focal'), sw: num('sw'), sh: num('sh'), sunAz: num('sunaz'), sunAlt: num('sunalt'),
  };
}

function applyUrlStateToInputs(s) {
  if (s.lat !== undefined && s.lon !== undefined) latlonEl.value = `${s.lat}, ${s.lon}`;
  if (s.focal !== undefined) focalEl.value = s.focal;

  if (s.sw !== undefined && s.sh !== undefined) {
    const presetValue = `${s.sw},${s.sh}`;
    const match = [...sensorPresetEl.options].some((o) => o.value === presetValue);

    if (match) {
      sensorPresetEl.value = presetValue;
    } else {
      sensorPresetEl.value = 'custom';
      sensorWEl.value = s.sw;
      sensorHEl.value = s.sh;
      customRowEl.style.display = 'block';
    }
  }

  if (s.sunAz !== undefined) sunAzEl.value = s.sunAz;
  if (s.sunAlt !== undefined) sunAltEl.value = s.sunAlt;
}

// Camera x/z are meters from (originLat, originLon); converting back to real lat/lon lets
// the URL capture wherever WASD/Space/C walked the camera to, not just the loaded point.
function syncUrl() {
  if (!originLat && !originLon) return;

  const { latM, lonM } = metersPerDegree(originLat);
  const lat = originLat - camera.position.z / latM;
  const lon = originLon + camera.position.x / lonM;
  const [sw, sh] = getSensorSizeMM();

  const params = new URLSearchParams({
    lat: lat.toFixed(6),
    lon: lon.toFixed(6),
    alt: camera.position.y.toFixed(1),
    yaw: THREE.MathUtils.radToDeg(camera.rotation.y).toFixed(1),
    pitch: THREE.MathUtils.radToDeg(camera.rotation.x).toFixed(1),
    focal: focalEl.value,
    sw, sh,
    sunaz: sunAzEl.value,
    sunalt: sunAltEl.value,
  });

  history.replaceState(null, '', '?' + params.toString());
}

function disposeMesh(mesh) {
  if (!mesh) return;
  scene.remove(mesh);
  mesh.geometry.dispose();
  if (mesh.material.map) mesh.material.map.dispose();
  mesh.material.dispose();
}

async function reload(override) {
  const [latStr, lonStr] = latlonEl.value.split(',').map((s) => s.trim());
  const lat = parseFloat(latStr), lon = parseFloat(lonStr);

  if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
    statusEl.textContent = `Error: could not parse "${latlonEl.value}" as "lat, lon"`;
    return;
  }

  const zoom = DEM_ZOOM;

  loadBtn.disabled = true;
  statusEl.textContent = 'Fetching DEM + imagery tiles…';

  try {
    const [dem, farDem, satelliteCanvas] = await Promise.all([
      loadTerrain(lat, lon, zoom, GRID_RADIUS),
      loadTerrain(lat, lon, FAR_ZOOM, FAR_GRID_RADIUS).catch((err) => {
        console.warn('horizon ring unavailable, skipping it:', err);
        return null;
      }),
      loadSatelliteImagery(lat, lon, zoom, GRID_RADIUS).catch((err) => {
        console.warn('satellite imagery unavailable, falling back to elevation tint:', err);
        return null;
      }),
    ]);

    statusEl.textContent = 'Building terrain mesh…';

    disposeMesh(terrainMesh);
    disposeMesh(farTerrainMesh);
    terrainMesh = null;
    farTerrainMesh = null;

    const built = buildTerrainMesh(dem, lat, lon, MESH_STRIDE, true);
    centerElevation = built.centerElevation;

    let material;
    if (satelliteCanvas) {
      const texture = new THREE.CanvasTexture(satelliteCanvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      material = new THREE.MeshStandardMaterial({ map: texture, roughness: 1 });
    } else {
      material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 });
    }

    terrainMesh = new THREE.Mesh(built.geometry, material);
    scene.add(terrainMesh);

    built.geometry.computeBoundingBox();
    const bb = built.geometry.boundingBox;
    // The smaller of the two axis extents, so a square hole cut from the far mesh always
    // lands fully inside the near mesh's footprint on both axes (never pokes past it and
    // leaves a gap), with a 5% margin on top for grid-cell rounding at the cut edge.
    const nearHalfSize = 0.95 * Math.min(
      Math.min(Math.abs(bb.min.x), bb.max.x),
      Math.min(Math.abs(bb.min.z), bb.max.z),
    );

    if (farDem) {
      const farBuilt = buildTerrainMesh(farDem, lat, lon, FAR_MESH_STRIDE, false, nearHalfSize);
      farTerrainMesh = new THREE.Mesh(farBuilt.geometry, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
      scene.add(farTerrainMesh);
    }

    originLat = lat;
    originLon = lon;
    camera.position.set(0, override?.alt ?? (centerElevation + DEFAULT_EYE_HEIGHT), 0);
    yaw = THREE.MathUtils.degToRad(override?.yaw ?? 0);
    pitch = THREE.MathUtils.degToRad(override?.pitch ?? 0);
    camera.rotation.set(pitch, yaw, 0);

    statusEl.textContent = `${lat.toFixed(5)}, ${lon.toFixed(5)} — ground elevation ${centerElevation.toFixed(0)}m`
      + (satelliteCanvas ? ' — imagery © Esri, Maxar, Earthstar Geographics' : ' — imagery unavailable, showing elevation tint');

    syncUrl();
  } catch (err) {
    statusEl.textContent = 'Error: ' + err.message
      + (err.message.includes('fetch') ? ' (possible CORS/network issue reaching the tile source)' : '');
    console.error(err);
  } finally {
    loadBtn.disabled = false;
  }
}

loadBtn.addEventListener('click', () => reload());
[focalEl, sensorWEl, sensorHEl].forEach((e) => e.addEventListener('input', () => { updateFraming(); syncUrl(); }));
sensorPresetEl.addEventListener('change', () => {
  customRowEl.style.display = sensorPresetEl.value === 'custom' ? 'block' : 'none';
  updateFraming();
  syncUrl();
});
[sunAzEl, sunAltEl].forEach((e) => e.addEventListener('input', () => { updateSun(); syncUrl(); }));

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  updateFraming();
});

// tripod-style pan/tilt: rotate the camera about its own fixed position, never translate it
let yaw = 0, pitch = 0, dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', (e) => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  renderer.domElement.classList.add('dragging');
});
window.addEventListener('pointerup', () => { dragging = false; renderer.domElement.classList.remove('dragging'); });
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  yaw -= (e.clientX - lastX) * 0.003;
  pitch -= (e.clientY - lastY) * 0.003;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
  lastX = e.clientX; lastY = e.clientY;
  camera.rotation.set(pitch, yaw, 0);
});

// WASD to walk (camera-relative, ignoring pitch so looking down doesn't dive into the
// ground), Space/C to rise/sink — lets you scout other vantage points within the loaded
// terrain without re-fetching tiles for every candidate spot.
const MOVE_SPEED = 24; // m/s
const keys = {};
window.addEventListener('keydown', (e) => {
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault(); // don't let it scroll the page
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const move = new THREE.Vector3();

function updateMovement(dt) {
  camera.getWorldDirection(forward);
  forward.y = 0;
  if (forward.lengthSq() > 1e-6) forward.normalize();
  right.crossVectors(forward, camera.up).normalize();

  move.set(0, 0, 0);
  if (keys.KeyW) move.add(forward);
  if (keys.KeyS) move.sub(forward);
  if (keys.KeyD) move.add(right);
  if (keys.KeyA) move.sub(right);
  if (move.lengthSq() > 0) move.normalize().multiplyScalar(MOVE_SPEED * dt);
  camera.position.add(move);

  if (keys.Space) camera.position.y += MOVE_SPEED * dt;
  if (keys.KeyC) camera.position.y -= MOVE_SPEED * dt;
}

let lastFrameTime = performance.now();
let lastUrlSyncTime = 0;
const URL_SYNC_INTERVAL_MS = 500; // throttles history.replaceState during drag/WASD

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  updateMovement(Math.min(0.1, (now - lastFrameTime) / 1000));
  lastFrameTime = now;

  if (now - lastUrlSyncTime > URL_SYNC_INTERVAL_MS) {
    syncUrl();
    lastUrlSyncTime = now;
  }

  renderer.render(scene, camera);
}

const initialState = parseUrlState();
applyUrlStateToInputs(initialState);

updateSun();
updateFraming();
animate();
reload(initialState);
</script>
</body>
</html>
