<!DOCTYPE html>
<html lang="en" style="height:100%;padding:0;margin:0">
<head>
    <title>GPX Poster</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/static/favicon.png" type="image/png"/>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #111827;
            color: #f9fafb;
            font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #0d1117;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 28px 32px;
            width: 320px;
        }
        h1 {
            margin: 0 0 4px;
            color: #f97316;
            font-size: 17px;
        }
        label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }
        input[type="file"] {
            color: rgba(255, 255, 255, 0.7);
        }
        button {
            margin-top: 8px;
            padding: 10px;
            background: #f97316;
            color: #fff;
            border: none;
            border-radius: 6px;
            font: 600 14px/1 system-ui, -apple-system, sans-serif;
            cursor: pointer;
        }
        button:hover {
            background: #ea6c0a;
        }
        .hint {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }
        .error {
            color: #ef4444;
            font-size: 13px;
        }
    </style>
</head>
<body>
<form method="post" enctype="multipart/form-data">
    <h1>GPX Poster</h1>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <label>Background image
        <input type="file" name="image" accept="image/*" required>
    </label>
    <label>GPX track(s)
        <input type="file" name="gpx" accept=".gpx" multiple required>
    </label>
    <button type="submit">Create poster</button>
    <span class="hint">Uploads are deleted after {{.TTLMinutes}} minutes.</span>
</form>
</body>
</html>
