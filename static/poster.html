<!DOCTYPE html>
<html lang="en" style="height:100%;padding:0;margin:0">
<head>
    <title>GPX Poster</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/static/favicon.png" type="image/png"/>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
    <link rel="stylesheet" href="/static/poster.css" />
</head>
<body>
<div id="toolbar">
    <div class="toolbar-row">
        <span class="toolbar-brand">GPX Poster</span>
        <label class="toolbar-control">
            <span class="toolbar-control__label">Map opacity</span>
            <input type="range" id="opacity-slider" min="0" max="100" value="90">
            <span id="opacity-value">90%</span>
        </label>
        <label class="toolbar-control">
            <input type="checkbox" id="fills-checkbox">
            <span class="toolbar-control__label">Show fills</span>
        </label>
        <div id="track-colors"></div>
        <label class="toolbar-control">
            <span class="toolbar-control__label">Title</span>
            <input type="text" id="poster-title" class="toolbar-text-input" placeholder="(track name)">
        </label>
        <label class="toolbar-control">
            <input type="checkbox" id="stats-top-checkbox">
            <span class="toolbar-control__label">Stats on top</span>
        </label>
        <details class="toolbar-popover">
            <summary class="toolbar-popover__trigger">Stats ▾</summary>
            <div class="toolbar-popover__panel" id="stat-toggles"></div>
        </details>
        <div id="minichart-controls"></div>
        <details class="toolbar-popover">
            <summary class="toolbar-popover__trigger">Map Style ▾</summary>
            <div class="toolbar-popover__panel toolbar-popover__panel--wide">
                <label class="toolbar-control">
                    <span class="toolbar-control__label">Style URL</span>
                    <input type="text" id="style-url-input" class="toolbar-text-input" placeholder="https://...">
                </label>
                <label class="toolbar-control">
                    <span class="toolbar-control__label">or paste style JSON</span>
                </label>
                <textarea id="style-json-input" class="toolbar-textarea" rows="6"
                          placeholder='{"version": 8, "sources": {...}, "layers": [...]}'></textarea>
                <div id="style-error" class="toolbar-popover__error" hidden></div>
                <button id="style-apply-btn" type="button">Apply style</button>
                <a class="toolbar-popover__link" href="https://maplibre.org/maputnik/" target="_blank" rel="noopener">
                    Design a style in Maputnik ↗
                </a>
            </div>
        </details>
        <label class="toolbar-control">
            <span class="toolbar-control__label">Rotation</span>
            <input type="range" id="bearing-slider" min="-180" max="180" value="0" step="1">
            <span id="bearing-value"> 000°</span>
        </label>
        <button id="auto-rotate-btn" disabled>Auto</button>
        <span id="export-size" style="font-size:11px;color:rgba(255,255,255,0.4);font-variant-numeric:tabular-nums;margin-left:auto"></span>
        <button id="save-btn" disabled>Save as PNG</button>
    </div>
</div>
<div id="poster-wrapper">
    <div id="poster-frame">
        <img id="bg-image" alt="background" />
        <div id="map"></div>
        <canvas id="track-canvas"></canvas>
        <div id="stats-overlay"></div>
    </div>
</div>
<script>
    window.POSTER_CONFIG = {
        files: {{.Files}},
        styleURL: {{.StyleURL}},
        basePath: {{.BasePath}}
    };
</script>
<script type="text/javascript" src="/static/poster.js"></script>
</body>
</html>
